# Build the Commander container. Run from repo root:
#   gcloud builds submit --config agents/commander/cloudbuild.yaml .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/stadiumos/commander:latest
      - -f
      - agents/commander/Dockerfile
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south1-docker.pkg.dev/$PROJECT_ID/stadiumos/commander:latest

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/stadiumos/commander:latest

options:
  logging: CLOUD_LOGGING_ONLY
