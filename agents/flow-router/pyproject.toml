[project]
name = "stadiumos-flow-router"
version = "0.1.0"
description = "StadiumOS Flow Router Agent — computes safe crowd redirections"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=0.5.0",
    "google-cloud-aiplatform>=1.60",
    "google-genai>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
    "stadiumos-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flow_router_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
