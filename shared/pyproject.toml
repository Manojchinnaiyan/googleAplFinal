[project]
name = "stadiumos-shared"
version = "0.1.0"
description = "Shared events, Pub/Sub, and Firestore helpers for StadiumOS agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "google-cloud-pubsub>=2.23",
    "google-cloud-firestore>=2.16",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stadiumos_shared"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
