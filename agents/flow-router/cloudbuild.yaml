# Build the Flow Router container. Run from repo root:
#   gcloud builds submit --config agents/flow-router/cloudbuild.yaml .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/stadiumos/flow-router:latest
      - -f
      - agents/flow-router/Dockerfile
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south1-docker.pkg.dev/$PROJECT_ID/stadiumos/flow-router:latest

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/stadiumos/flow-router:latest

options:
  logging: CLOUD_LOGGING_ONLY
