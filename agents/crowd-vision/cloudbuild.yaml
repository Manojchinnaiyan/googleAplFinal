# Build the Crowd Vision container. Run from repo root:
#   gcloud builds submit --config agents/crowd-vision/cloudbuild.yaml .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/stadiumos/crowd-vision:latest
      - -f
      - agents/crowd-vision/Dockerfile
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-south1-docker.pkg.dev/$PROJECT_ID/stadiumos/crowd-vision:latest

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/stadiumos/crowd-vision:latest

options:
  logging: CLOUD_LOGGING_ONLY
